<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>登录 - CCW</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">CCW</div>
    <h1>CCW</h1>
    <p class="login-sub">轻量远程操控台</p>
    <form id="login-form">
      <label>账号</label>
      <input type="text" id="username" autocomplete="username" placeholder="用户名" required>
      <label>密码</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="密码" required>
      <button type="submit" id="login-btn">登录</button>
      <p class="login-err" id="login-err"></p>
    </form>
  </div>
</div>
<script src="/login.js"></script>
</body>
</html>
