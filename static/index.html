<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Claude Console</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="dot">CC</span> Claude Console</div>
    <div class="tabs">
      <div class="tab" data-view="files">文件</div>
      <div class="tab active" data-view="sessions">会话</div>
      <div class="tab" data-view="preview">预览</div>
      <div class="tab" data-view="admin">系统</div>
    </div>
    <button class="logout-btn" id="logout-btn">退出</button>
  </div>
  <div class="content" id="content"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
